{% extends "commun/base.html" %}
{% block titre %}Connexion - ShoeBoutique{% endblock %}
{% block contenu %}
<h1>Connexion</h1>
<p class="sous-titre">Connectez-vous pour acceder a votre panier et vos commandes.</p>

<div class="formulaire">
    {% if erreur %}<div class="alerte erreur">{{ erreur }}</div>{% endif %}

    <form action="{{ url_for('auth.connexion') }}" method="post">
        <div class="champ">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required value="{{ email or '' }}">
        </div>
        <div class="champ">
            <label for="mot_de_passe">Mot de passe</label>
            <input type="password" id="mot_de_passe" name="mot_de_passe" required>
        </div>
        <div class="champ">
            <label class="case-a-cocher">
                <input type="checkbox" name="accepte_cookies">
                J'accepte que ce site utilise des cookies pour ma session et mon panier.
            </label>
        </div>
        <button type="submit" class="bouton" style="width:100%;">Se connecter</button>
    </form>
    <p style="text-align:center; margin-top:1rem; font-size:.9rem;">
        Pas encore de compte ? <a href="{{ url_for('auth.inscription') }}" style="color:var(--couleur-accent); font-weight:600;">Inscrivez-vous</a>
    </p>
</div>
{% endblock %}
